<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CinéPrivé</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#8c2f39" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CinéPrivé">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png">
  </head>
  <body class="overflow-x-hidden">
    <div id="root">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #111315; color: white; font-family: ui-sans-serif, system-ui, sans-serif;">
        <svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 512 512" style="animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;">
          <g transform="translate(256 256)">
            <circle r="132" fill="none" stroke="#b04f5e" stroke-width="22" stroke-dasharray="600 200" transform="rotate(-40)"></circle>
            <path d="M-34 -46 L52 0 L-34 46 Z" fill="#b04f5e"></path>
          </g>
        </svg>
        <h1 style="margin-top: 20px; font-size: 24px; font-weight: bold; letter-spacing: -0.025em;">CinéPrivé</h1>
        <div style="margin-top: 16px; width: 40px; height: 40px; border: 3px solid rgba(140, 47, 57, 0.25); border-top-color: #b04f5e; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <style>
          @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
          @keyframes spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
