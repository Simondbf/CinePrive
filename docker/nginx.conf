# NGINX Reverse Proxy configuration for CinePrive
# Place this in /etc/nginx/conf.d/cineprive.conf or mount it in Docker

server {
    listen 80;
    server_name cineprive.fr staging.cineprive.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cineprive.fr;

    # SSL Certificates (Managed by certbot or similar)
    # ssl_certificate /etc/letsencrypt/live/cineprive.fr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/cineprive.fr/privkey.pem;

    client_max_body_size 10G; # Permettre le téléversement de gros fichiers

    # Proxy vers l'application Node.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name staging.cineprive.fr;

    # ssl_certificate /etc/letsencrypt/live/staging.cineprive.fr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/staging.cineprive.fr/privkey.pem;

    client_max_body_size 10G;

    location / {
        proxy_pass http://127.0.0.1:3001; # Port différent pour staging
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
